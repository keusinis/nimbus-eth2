participants_matrix:
  el:
    - el_type: ethrex
      el_image: ethpandaops/ethrex:heze-devnet-2
  cl:
    - cl_type: nimbus
      cl_image: ${NIMBUS_IMAGE}
    # - cl_type: grandine
    #   cl_image: ghcr.io/<owner>/grandine:eip8321
    # - cl_type: lighthouse
    #   cl_image: ghcr.io/<owner>/lighthouse:eip8321
    # - cl_type: teku
    #   cl_image: ghcr.io/<owner>/teku:eip8321
    # - cl_type: lodestar
    #   cl_image: ghcr.io/<owner>/lodestar:eip8321
    # - cl_type: prysm
    #   cl_image: ghcr.io/<owner>/prysm:eip8321
  count: 2
network_params:
  fulu_fork_epoch: 0
  gloas_fork_epoch: 1
  heze_fork_epoch: 2
ethereum_genesis_generator_params:
  image: eip8321-genesis-generator
  extra_env:
    EIP8321_FORK_EPOCH: "${EIP8321_FORK_EPOCH}"
    EIP8321_FORK_VERSION: "0xe8321000"
additional_services:
  - assertoor
  - dora
assertoor_params:
  run_stability_check: true
  run_block_proposal_check: true
